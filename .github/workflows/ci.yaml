name: CI

env:
  VERILATOR_ROOT: ${{ github.workspace }}/verilator

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup-verilator:
    uses: ./.github/workflows/setup-verilator.yml
    strategy:
      matrix:
        VERILATOR_VERSION: &verilator_versions
          - "v5.054"
    with:
      verilator-version: ${{ matrix.VERILATOR_VERSION }}

  lint:
    runs-on: ubuntu-latest
    needs: [setup-verilator]
    strategy:
      matrix:
        TOP_MODULE: &top_modules
          - "hax_soc"
        TYPE: &type_dv
          - "RTL"
          - "UVM"
        VERILATOR_VERSION: *verilator_versions
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Verilator cache
        uses: actions/cache@v6.1.0
        with:
          path: verilator
          key: verilator-${{ runner.os }}-${{ matrix.VERILATOR_VERSION }}
          fail-on-cache-miss: true

      - name: Debug
        if: ${{ env.ACTION_STEP_DEBUG || runner.debug == '1' }}
        run: |
          echo "List files:"
          ls -la
          echo "Verilator files:"
          ls -la verilator
          echo "VERILATOR_ROOT: $VERILATOR_ROOT"
          echo "Verilator version:"
          ${VERILATOR_ROOT}/bin/verilator --version

      - name: Run lint
        working-directory: .
        run: make lint TOP_MODULE=${{ matrix.TOP_MODULE }} TYPE=${{ matrix.TYPE }}

      - name: Save output
        uses: actions/upload-artifact@v6.0.0
        continue-on-error: true
        with:
          name: verilator-lint-output-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}
          path: .

  build:
    runs-on: ubuntu-latest
    needs: [setup-verilator, lint]
    strategy:
      matrix:
        TOP_MODULE: *top_modules
        TYPE: *type_dv
        VERILATOR_VERSION: *verilator_versions
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Verilator cache
        uses: actions/cache@v6.1.0
        with:
          path: verilator
          key: verilator-${{ runner.os }}-${{ matrix.VERILATOR_VERSION }}
          fail-on-cache-miss: true

      - name: Update package lists
        run: sudo apt-get update

      - name: Install Dependencies
        run: sudo apt-get install -y make ccache

      - name: Run build
        working-directory: .
        run: make build TOP_MODULE=${{ matrix.TOP_MODULE }} TYPE=${{ matrix.TYPE }}

      - name: Save output
        uses: actions/upload-artifact@v6.0.0
        continue-on-error: true
        with:
          name: verilator-build-output-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}
          path: .

  run:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    strategy:
      matrix:
        TOP_MODULE: *top_modules
        TYPE: ["UVM"]
        TEST: ["hax_soc_base_test"]
        VERILATOR_VERSION: *verilator_versions
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download build artifact
        uses: actions/download-artifact@v6.0.0
        continue-on-error: true
        with:
          name: verilator-build-output-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}
          path: .

      - name: Restore Verilator cache
        uses: actions/cache@v6.1.0
        with:
          path: verilator
          key: verilator-${{ runner.os }}-${{ matrix.VERILATOR_VERSION }}
          fail-on-cache-miss: true

      - name: Update package lists
        run: sudo apt-get update

      - name: Install Dependencies
        run: sudo apt-get install -y make ccache

      - name: Debug
        if: ${{ env.ACTION_STEP_DEBUG || runner.debug == '1' }}
        run: |
          echo "List files:"
          tree -a -L 3
          echo "Output files:"
          ls -la output/${{ matrix.TOP_MODULE }}

      - name: Run test
        run: make run TOP_MODULE=${{ matrix.TOP_MODULE }} TYPE=${{ matrix.TYPE }} TEST=${{ matrix.TEST }}

      - name: Save output
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: verilator-run-output-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}-${{ matrix.TEST }}
          path: .

  ci-gate:
    name: CI Gate
    if: ${{ always() && (github.event_name != 'push' || github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'Merge pull request')) }}
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - setup-verilator
      - lint
      - build
      - run
    steps:
      - name: Verify all CI jobs succeeded
        run: |
          SETUP_VERILATOR_RESULT="${{ needs.setup-verilator.result }}"
          LINT_RESULT="${{ needs.lint.result }}"
          BUILD_RESULT="${{ needs.build.result }}"
          RUN_RESULT="${{ needs.run.result }}"
          annotate_check() {
            local check_name="$1"
            local check_result="$2"
            if [[ "${check_result}" == "success" ]]; then
              echo "::notice title=CI Gate::✅ ${check_name}: ${check_result}"
            else
              echo "::error title=CI Gate::❌ ${check_name}: ${check_result}"
            fi
          }
          annotate_check "Setup Verilator" "${SETUP_VERILATOR_RESULT}"
          annotate_check "Lint" "${LINT_RESULT}"
          annotate_check "Build" "${BUILD_RESULT}"
          annotate_check "Run" "${RUN_RESULT}"
          {
            echo "## CI Gate Report"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Setup Verilator | ${SETUP_VERILATOR_RESULT} |"
            echo "| Lint | ${LINT_RESULT} |"
            echo "| Build | ${BUILD_RESULT} |"
            echo "| Run | ${RUN_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${SETUP_VERILATOR_RESULT}" != "success" || \
                "${LINT_RESULT}" != "success" || \
                "${BUILD_RESULT}" != "success" || \
                "${RUN_RESULT}" != "success" ]]; then
            echo "CI Gate failed because one or more upstream jobs did not succeed."
            exit 1
          fi