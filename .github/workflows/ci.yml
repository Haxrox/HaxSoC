name: CI

env:
  VERILATOR_ROOT: ${{ github.workspace }}/verilator
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CXX: ccache g++
  CC: ccache gcc

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-verilator:
    uses: ./.github/workflows/setup-verilator.yml
    strategy:
      matrix:
        VERILATOR_VERSION: &verilator_versions
          - "v5.054"
    with:
      verilator-version: ${{ matrix.VERILATOR_VERSION }}

  lint:
    runs-on: ubuntu-latest
    needs: [setup-verilator]
    strategy:
      matrix:
        TOP_MODULE: &top_modules
          - "hax_soc"
        TYPE: &type_dv
          - "RTL"
          - "UVM"
        VERILATOR_VERSION: *verilator_versions
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Verilator cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: verilator
          key: verilator-${{ runner.os }}-${{ matrix.VERILATOR_VERSION }}
          fail-on-cache-miss: true

      - name: Debug
        if: ${{ env.ACTION_STEP_DEBUG || runner.debug == '1' }}
        run: |
          echo "List files:"
          ls -la
          echo "Verilator files:"
          ls -la verilator
          echo "VERILATOR_ROOT: $VERILATOR_ROOT"
          echo "Verilator version:"
          ${VERILATOR_ROOT}/bin/verilator --version

      - name: Run lint
        working-directory: .
        run: make lint TOP_MODULE=${{ matrix.TOP_MODULE }} TYPE=${{ matrix.TYPE }}

      - name: Save output
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: verilator-lint-output-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}
          path: .

  build:
    runs-on: ubuntu-latest
    needs: [setup-verilator, lint]
    strategy:
      matrix:
        TOP_MODULE: *top_modules
        TYPE: *type_dv
        VERILATOR_VERSION: *verilator_versions
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Verilator cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: verilator
          key: verilator-${{ runner.os }}-${{ matrix.VERILATOR_VERSION }}
          fail-on-cache-miss: true

      - name: Update package lists
        run: sudo apt-get update

      - name: Install Dependencies
        run: sudo apt-get install -y make ccache

      - name: Run build
        working-directory: .
        run: make build TOP_MODULE=${{ matrix.TOP_MODULE }} TYPE=${{ matrix.TYPE }}

      - name: Cache ccache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.VERILATOR_VERSION }}-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}-${{ hashFiles('**/*.sv', '**/*.v', '**/*.h', '**/*.cpp', '**/*.cc', 'Makefile', '**/filelists/**', '**/*.f') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.VERILATOR_VERSION }}-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}

      - name: Save output
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: verilator-build-output-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}
          path: .

  run:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    strategy:
      matrix:
        TOP_MODULE: *top_modules
        TYPE: ["UVM"]
        TEST: ["hax_soc_base_test"]
        VERILATOR_VERSION: *verilator_versions
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: verilator-build-output-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}
          path: .

      - name: Restore Verilator cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: verilator
          key: verilator-${{ runner.os }}-${{ matrix.VERILATOR_VERSION }}
          fail-on-cache-miss: true

      - name: Restore ccache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.VERILATOR_VERSION }}-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}-${{ hashFiles('**/*.sv', '**/*.v', '**/*.h', '**/*.cpp', '**/*.cc', 'Makefile', '**/filelists/**', '**/*.f') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.VERILATOR_VERSION }}-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}

      - name: Update package lists
        run: sudo apt-get update

      - name: Install Dependencies
        run: sudo apt-get install -y make ccache

      - name: Debug
        if: ${{ env.ACTION_STEP_DEBUG || runner.debug == '1' }}
        run: |
          echo "List files:"
          tree -a -L 3
          echo "Output files:"
          ls -la output/${{ matrix.TOP_MODULE }}

      - name: Run test
        run: make run TOP_MODULE=${{ matrix.TOP_MODULE }} TYPE=${{ matrix.TYPE }} TEST=${{ matrix.TEST }}

      - name: Save output
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: verilator-run-output-${{ matrix.TOP_MODULE }}-${{ matrix.TYPE }}-${{ matrix.TEST }}
          path: .

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    permissions: {}
    needs: [setup-verilator, lint, build, run]
    uses: Haxrox/HaxGHA/.github/workflows/reuse-ci-gate.yml@v1
